<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="ワイヤレスイヤホンと充電ケース">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe3e8"/>
    </linearGradient>
    <linearGradient id="caseG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbfc"/>
      <stop offset="1" stop-color="#d9dde3"/>
    </linearGradient>
  </defs>
  <ellipse cx="200" cy="222" rx="150" ry="12" fill="#000" opacity="0.08"/>
  <!-- case -->
  <rect x="135" y="120" width="130" height="96" rx="40" fill="url(#caseG)" stroke="#c4c9d1" stroke-width="2"/>
  <line x1="137" y1="150" x2="263" y2="150" stroke="#c4c9d1" stroke-width="2"/>
  <circle cx="200" cy="184" r="3.5" fill="#9aa3ae"/>
  <!-- left bud -->
  <g transform="translate(92 52) rotate(-14)">
    <rect x="18" y="40" width="18" height="70" rx="9" fill="url(#body)" stroke="#c4c9d1" stroke-width="2"/>
    <ellipse cx="27" cy="38" rx="26" ry="24" fill="url(#body)" stroke="#c4c9d1" stroke-width="2"/>
    <ellipse cx="17" cy="34" rx="9" ry="8" fill="#5d6673"/>
  </g>
  <!-- right bud -->
  <g transform="translate(272 46) rotate(14)">
    <rect x="18" y="40" width="18" height="70" rx="9" fill="url(#body)" stroke="#c4c9d1" stroke-width="2"/>
    <ellipse cx="27" cy="38" rx="26" ry="24" fill="url(#body)" stroke="#c4c9d1" stroke-width="2"/>
    <ellipse cx="37" cy="34" rx="9" ry="8" fill="#5d6673"/>
  </g>
</svg>
